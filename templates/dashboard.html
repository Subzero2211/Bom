<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Intelligence Engine - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        header p { font-size: 1.1em; opacity: 0.9; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        .card h2 { color: #667eea; margin-bottom: 15px; font-size: 1.3em; }
        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .stat:last-child { border-bottom: none; }
        .stat-label { font-weight: 600; color: #333; }
        .stat-value { font-size: 1.3em; color: #667eea; font-weight: bold; }
        .status-ok { color: #10b981; }
        .status-warning { color: #f59e0b; }
        .status-critical { color: #ef4444; }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .findings {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .finding-item {
            padding: 15px;
            margin-bottom: 10px;
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .button:hover { background: #764ba2; }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .success-message {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th { background: #f5f5f5; font-weight: 600; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛰️ OSINT Intelligence Engine</h1>
            <p>Real-time Geopolitical Intelligence Dashboard</p>
        </header>

        <div class="grid">
            <div class="card">
                <h2>📊 Sistem Durumu</h2>
                <div id="status-content" class="loading">
                    <div class="spinner"></div>
                    Yükleniyor...
                </div>
            </div>

            <div class="card">
                <h2>⚠️ Anomaliler</h2>
                <div id="anomalies-content" class="loading">
                    <div class="spinner"></div>
                    Yükleniyor...
                </div>
            </div>

            <div class="card">
                <h2>🔗 Korelasyonlar</h2>
                <div id="clusters-content" class="loading">
                    <div class="spinner"></div>
                    Yükleniyor...
                </div>
            </div>

            <div class="card">
                <h2>📍 Ham Olaylar</h2>
                <div id="events-content" class="loading">
                    <div class="spinner"></div>
                    Yükleniyor...
                </div>
            </div>

            <div class="card">
                <h2>🎯 Kaynaklar</h2>
                <div id="sources-content" class="loading">
                    <div class="spinner"></div>
                    Yükleniyor...
                </div>
            </div>

            <div class="card">
                <h2>⚙️ İşlemler</h2>
                <button class="button" onclick="triggerScan()">🔄 Manuel Tarama Başlat</button>
                <button class="button" onclick="location.reload()">🔁 Sayfayı Yenile</button>
                <p style="margin-top: 15px; font-size: 0.9em; color: #666;">Son güncelleme: <span id="last-update">-</span></p>
            </div>
        </div>

        <div class="findings">
            <h2>📋 Detaylı Rapor</h2>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('report')">Rapor</button>
                <button class="tab-btn" onclick="switchTab('insights')">İçgörüler</button>
            </div>
            <div id="report" class="tab-content active"></div>
            <div id="insights" class="tab-content"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';

        // Durum güncelle
        async function updateStatus() {
            try {
                const response = await fetch(`${API_URL}/api/status`);
                const data = await response.json();

                const statusClass = data.status === 'ok' ? 'status-ok' :
                                   data.status === 'warning' ? 'status-warning' : 'status-critical';

                document.getElementById('status-content').innerHTML = `
                    <div class="stat">
                        <span class="stat-label">Durum</span>
                        <span class="stat-value ${statusClass}">${data.status.toUpperCase()}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Son Rapor</span>
                        <span class="stat-value">${new Date(data.last_report).toLocaleString('tr-TR')}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Aktif Anomaliler</span>
                        <span class="stat-value">${data.active_anomalies}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Aktif Korelasyonlar</span>
                        <span class="stat-value">${data.active_clusters}</span>
                    </div>
                `;
            } catch (e) {
                document.getElementById('status-content').innerHTML = `<div class="error-message">Bağlantı hatası: ${e.message}</div>`;
            }
        }

        // Anomalileri güncelle
        async function updateAnomalies() {
            try {
                const response = await fetch(`${API_URL}/api/anomalies?hours=24`);
                const data = await response.json();

                if (data.count === 0) {
                    document.getElementById('anomalies-content').innerHTML = '<p style="color: #666;">Anormal durum tespit edilmedi</p>';
                } else {
                    let html = `<div class="stat"><span class="stat-label">Toplam</span><span class="stat-value">${data.count}</span></div>`;
                    data.data.slice(0, 3).forEach(a => {
                        html += `<div class="stat"><span class="stat-label">${a.domain || 'N/A'}</span><span class="stat-value">${a.severity || 'INFO'}</span></div>`;
                    });
                    document.getElementById('anomalies-content').innerHTML = html;
                }
            } catch (e) {
                document.getElementById('anomalies-content').innerHTML = `<div class="error-message">Hata: ${e.message}</div>`;
            }
        }

        // Korelasyonları güncelle
        async function updateClusters() {
            try {
                const response = await fetch(`${API_URL}/api/clusters?hours=24`);
                const data = await response.json();

                if (data.count === 0) {
                    document.getElementById('clusters-content').innerHTML = '<p style="color: #666;">Korelasyon kümesi bulunamadı</p>';
                } else {
                    document.getElementById('clusters-content').innerHTML = `
                        <div class="stat">
                            <span class="stat-label">Toplam Küme</span>
                            <span class="stat-value">${data.count}</span>
                        </div>
                    `;
                }
            } catch (e) {
                document.getElementById('clusters-content').innerHTML = `<div class="error-message">Hata: ${e.message}</div>`;
            }
        }

        // Ham olayları güncelle
        async function updateEvents() {
            try {
                const response = await fetch(`${API_URL}/api/events?hours=6&limit=5`);
                const data = await response.json();

                if (data.count === 0) {
                    document.getElementById('events-content').innerHTML = '<p style="color: #666;">Olay bulunamadı</p>';
                } else {
                    let html = `<div class="stat"><span class="stat-label">Son 6 Saat</span><span class="stat-value">${data.count}</span></div>`;
                    document.getElementById('events-content').innerHTML = html;
                }
            } catch (e) {
                document.getElementById('events-content').innerHTML = `<div class="error-message">Hata: ${e.message}</div>`;
            }
        }

        // Kaynakları güncelle
        async function updateSources() {
            try {
                const response = await fetch(`${API_URL}/api/sources`);
                const data = await response.json();

                let html = `
                    <div class="stat">
                        <span class="stat-label">RSS Kaynakları</span>
                        <span class="stat-value">${data.rss_feeds.length}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Reddit Sublar</span>
                        <span class="stat-value">${data.reddit_subs.length}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Telegram Kanalları</span>
                        <span class="stat-value">${data.telegram_channels.length}</span>
                    </div>
                `;
                document.getElementById('sources-content').innerHTML = html;
            } catch (e) {
                document.getElementById('sources-content').innerHTML = `<div class="error-message">Hata: ${e.message}</div>`;
            }
        }

        // Raporu güncelle
        async function updateReport() {
            try {
                const response = await fetch(`${API_URL}/api/report`);
                if (response.status === 404) {
                    document.getElementById('report').innerHTML = '<p style="color: #666;">Henüz rapor yok</p>';
                } else {
                    const data = await response.json();
                    let html = `<h3>Rapor ID: ${data.report_id}</h3><p>Durum: <strong>${data.system_status}</strong></p>`;

                    if (data.key_findings && data.key_findings.length > 0) {
                        html += '<h4>Ana Bulgular:</h4>';
                        data.key_findings.forEach(f => {
                            html += `<div class="finding-item">${f}</div>`;
                        });
                    }

                    if (data.watch_list && data.watch_list.length > 0) {
                        html += '<h4>İzleme Listesi:</h4>';
                        data.watch_list.forEach(w => {
                            html += `<div class="finding-item">📍 ${w}</div>`;
                        });
                    }

                    document.getElementById('report').innerHTML = html || '<p style="color: #666;">Veri bulunamadı</p>';
                }
            } catch (e) {
                document.getElementById('report').innerHTML = `<div class="error-message">Hata: ${e.message}</div>`;
            }
        }

        // İçgörüleri güncelle
        async function updateInsights() {
            try {
                const response = await fetch(`${API_URL}/api/insights?hours=24`);
                const data = await response.json();

                let html = `<p>Toplam Anomali: ${data.total_anomalies} | Toplam Küme: ${data.total_clusters}</p>`;

                if (data.anomaly_insights && data.anomaly_insights.length > 0) {
                    html += '<h4>Anomali İçgörüleri:</h4>';
                    data.anomaly_insights.forEach((a, i) => {
                        html += `<div class="finding-item"><strong>#${i+1}</strong><br>${a.interpretation || JSON.stringify(a).substring(0, 100)}</div>`;
                    });
                }

                document.getElementById('insights').innerHTML = html || '<p style="color: #666;">İçgörü bulunamadı</p>';
            } catch (e) {
                document.getElementById('insights').innerHTML = `<div class="error-message">Hata: ${e.message}</div>`;
            }
        }

        // Manuel tarama başlat
        async function triggerScan() {
            try {
                const response = await fetch(`${API_URL}/api/scan`, { method: 'POST' });
                const data = await response.json();
                alert('✓ Tarama başlatıldı: ' + data.status);
                setTimeout(refreshAll, 2000);
            } catch (e) {
                alert('✗ Tarama başlatılamadı: ' + e.message);
            }
        }

        // Tab değiştir
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // Tümünü yenile
        async function refreshAll() {
            await Promise.all([
                updateStatus(),
                updateAnomalies(),
                updateClusters(),
                updateEvents(),
                updateSources(),
                updateReport(),
                updateInsights()
            ]);
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString('tr-TR');
        }

        // İlk yüklemede ve her 30 saniyede yenile
        refreshAll();
        setInterval(refreshAll, 30000);
    </script>
</body>
</html>
